<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدولة المكالمات الذكية | Smart Call Scheduler</title>
    <link rel="stylesheet" href="schedule-call.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scheduler-box">
        <h3><i class="fa-solid fa-phone-volume"></i> حدد الوقت المناسب لمكالمتك</h3>
        <p>اختر الوقت الذي يناسبك وسيقوم مسؤول المبيعات بالاتصال بك فوراً في الموعد</p>
        <form id="callForm">
            <input type="text" placeholder="اسمك الكريم" required>
            <input type="tel" placeholder="رقم الموبايل" required>
            <input type="date" id="callDate" required>
            <select id="callTime">
                <option value="12:00 PM">12:00 ظهراً</option>
                <option value="04:00 PM">04:00 عصراً</option>
                <option value="08:00 PM">08:00 مساءً</option>
            </select>
            <button type="submit">تأكيد الموعد</button>
        </form>
    </div>
    <script src="schedule-call.js"></script>
</body>
</html>
